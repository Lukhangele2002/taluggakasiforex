<!DOCTYPE html>
<html lang="en">
<head>

  <title>Payment Cancelled</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      color: #fff;
      background: linear-gradient(135deg, #0a0f2c, #001f3f, #003366);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .box {
      background: rgba(255,255,255,0.05);
      padding: 40px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 25px rgba(0,212,255,0.3);
      max-width: 500px;
    }

    h1 {
      color: #ff4444;
      text-shadow: 0 0 10px #ff4444;
    }

    p {
      font-size: 18px;
      color: #ccc;
      margin: 15px 0;
    }

    a {
      display: inline-block;
      margin: 15px 10px 0;
      padding: 12px 25px;
      background: #00d4ff;
      color: #000;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }

    a:hover {
      opacity: 0.9;
    }

    .closing {
      margin-top: 30px;
      color: #00d4ff;
      white-space: pre-line;
      font-size: 16px;
    }
  </style>
</head>
