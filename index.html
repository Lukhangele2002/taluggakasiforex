<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cognac Blueberry Scalper</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Search Console Verification -->
  <meta name="google-site-verification" content="-ywetkx9vw3mKoJ_iRwbIbFU-sXLumApTnkNsI-BZaA" />

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      color: #fff;
      background: linear-gradient(135deg, #0a0f2c, #001f3f, #003366);
      overflow-x: hidden;
    }

    h1, h2 {
      color: #00d4ff;
      text-shadow: 0 0 10px #00d4ff;
    }

    p.lead {
      font-size: 18px;
      margin: 20px 0;
      color: #ccc;
    }

    .highlight {
      color: #00d4ff;
      font-weight: bold;
    }

    .btn {
      display: inline-block;
      padding: 15px 30px;
      background: #00d4ff;
      color: #000;
      border: none;
      border-radius: 5px;
      font-size: 18px;
      cursor: pointer;
      text-decoration: none;
    }

    .btn.secondary {
      background: #007bff;
      color: #fff;
    }

    .btn:hover {
      opacity: 0.9;
    }

    input[type=email] {
      padding: 10px;
      margin: 10px;
      width: 280px;
    }

    .welcome-box,
    .section-box {
      background: rgba(255,255,255,0.05);
      padding: 20px;
      margin: 30px;
      border-radius: 10px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 20px rgba(0,212,255,0.2);
    }

    .chart-line {
      position: fixed;
      width: 100%;
      height: 2px;
      background: linear-gradient(to right, transparent, #00d4ff, transparent);
      animation: moveLine 4s linear infinite;
      opacity: 0.3;
    }

    @keyframes moveLine {
      from { transform: translateY(-100vh); }
      to { transform: translateY(100vh); }
    }

    .tradingview-widget-container {
      margin: 30px auto;
      width: 100%;
      max-width: 1000px;
    }

    .contact-box {
      margin: 40px 0;
    }

    .contact-box p {
      font-size: 18px;
      margin: 15px 0;
      color: #fff;
    }

    .closing {
      margin: 60px 0;
      font-size: 18px;
      color: #00d4ff;
      white-space: pre-line;
    }
  </style>
</head>
